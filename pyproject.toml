[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-ts-discovery"
version = "0.1.0"
description = "Causal discovery in autocorrelated time series with cycles and latent confounders"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "tigramite>=5.2",
    "statsmodels>=0.14",
    "causal-learn>=0.1.3.8",
    "lingam>=1.5.0",
    "requests>=2.28",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
climate = ["xarray>=2023.1", "netcdf4"]

[tool.setuptools.packages.find]
where = ["src"]
